{% extends "base.html" %}


{% block title %}
Workout Complete
{% endblock %}

{% block content %}

<div class="interface-container center-grid">


    <h1 class="title-box">Workout Complete!</h1>

    <h2 class="subtitle-box">Workout {{ workout_id }}</h2>

    <p class="logs">Exercises Completed: {{ exercise_count }}</p>

    <p class="logs">Sets Logged: {{ set_count }}</p>

    <a href="/">
        <button type="submit">Home</button>
    </a>

</div>

{% endblock %}
